# 跨机两段：本机 0:32（12 层上卡）+ ROG 32:40（8 层纯 CPU）。
#
# 段数与节点数一致——本机一个进程、ROG 一个进程。之前把本机拆成三段是错的：
# 每多一个进程，就多一份 token_embd/output 读取、一块 compute buffer，以及一轮页竞争。
#
# 12 层上卡是 8 GiB 显存的实测上限（12 层 6.70 GiB；16 层会溢出并掉到 14.21 t/s）。
# ROG 侧 8 层同样是它的上限（15.2 GiB 总内存，约 3.8 GiB 可用）。
source_layers = 40

[[stage]]
model       = "F:/qlh-models/qwen3-6-35b-a3b-gguf/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
host        = "127.0.0.1"
port        = 9101
layers      = 32
layer_range = "0:32"
kind        = "gpu"
gpu_layers  = 12
cpu_moe     = 0
cpus        = ""
threads     = 8

