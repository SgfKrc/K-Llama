# 2B 模型的两段，用于 TUI 与协议验证。1.66 GB，内存开销可忽略。
#
# 覆盖完整的 24 个解码层：20 + 4。源模型 qwen35-2b 的 block_count=25 里含 1 个 MTP 层，
# 解码层是 24，所以 source_layers 必须是 24。
#
# ★ 本文件早期版本用 head16 + cut-16-20，只覆盖 20 层，缺 blk.20..23。症状是输出完全
#   错乱："中国的首都是" 答成 "______。<think>用户的问题是 asking what capitalsitalize…"，
#   看起来像模型坏了。补上那 4 层之后同一个模型答 "北京，但北京并非中国唯一的…"。
#   工件不完整时不要去怀疑模型，先用 source_layers 核对覆盖。
#
# 真实端到端见 topology-rog4.toml（35B 四段，需 ROG）。
#
# 不绑核：实测绑 "0,1" 时同一个 step 从 50 ms 涨到秒级。i9-13900H 的相邻逻辑核
# 可能是同一物理 P-core 的超线程对（见 docs/MEMORY-LIMITS.md §3.4）。

source_layers = 24

[[stage]]
model      = "F:/qlh-models/archive-q35-2b/q35-2b-head20.gguf"
host       = "127.0.0.1"
port       = 9401
layers     = 20
kind       = "gpu"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 4

[[stage]]
model      = "F:/qlh-models/archive-q35-2b/q35-2b-tail20-24.gguf"
host       = "127.0.0.1"
port       = 9402
layers     = 4
kind       = "tail"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 4
