# 四段：master 跑 0-8 + 8-24 + 24-32，ROG 跑 32-40。
#
# 为什么这么切：ROG 单跑 16 层是 10.6 ms/层、8 层是 8.9 ms/层，层数减半只省 16%，
# 但那台机器上还压着 npm、java 和 qemu，把 8.96 GB 的工件换成 5.04 GB 能把它从
# 换页边缘拉回来。master 因此多背一段 8 层的 24-32。
#
# 段间仍只传 hidden（2048 维，8 KB/token），多一段就多一次本地 socket 往返，
# 不涉及跨机带宽。

source_layers = 40

[[stage]]
model      = "F:/qlh-models/stage-split-3/stage-0-8.gguf"
host       = "127.0.0.1"
port       = 9101
layers     = 8
kind       = "gpu"
gpu_layers = 99
cpu_moe    = 0
cpus       = ""
threads    = 3

[[stage]]
model      = "F:/qlh-models/stage-split-3/stage-8-24.gguf"
host       = "127.0.0.1"
port       = 9102
layers     = 16
kind       = "cpu"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 6

[[stage]]
model      = "F:/qlh-models/stage-split-3/stage-24-32.gguf"
host       = "127.0.0.1"
port       = 9104
layers     = 8
kind       = "cpu"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 6

[[stage]]
# ROG：只跑 8 层（源 32-40），工件 5.04 GB。
model      = "L:/qlh-models/stage-split-3/tail-32-40.gguf"
host       = "100.116.17.12"
port       = 9103
layers     = 8
kind       = "tail"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 6
