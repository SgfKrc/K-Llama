# 核心测试门（CI 兜底）
#
# ## 为什么单独一个 workflow
#
# `checks.yml`（文档门）与 `relay-gates.yml`（合成 self-check）都是**秒级、零依赖**的静态兜底。
# 核心 pytest 要安装 `requirements-test.txt`（torch / transformers / llama-cpp-python）并跑分钟级，
# 混进文档门会把它从秒级拖成分钟级，失去"改一行文案也能立刻拿到反馈"的用途。
# 因此这里单独一个 job：文档门保持秒级，测试门负责真实回归。
#
# ## 与 pre-push 的分工
#
# `.githooks/pre-push` 只跑 `scripts/run_doc_checks.py`（本地秒级拦截），完整 pytest 不在推送
# 路径上阻塞，由本 workflow 兜底。
#
# ## 跑法直接复用 `scripts/run_test_channels.py`
#
# 通道划分与"重档/真机不进并行段"的判据由该脚本单点定义，本 workflow 不重复维护一份 `-m` 表达式：
# `unit`（并行，排除 external / requires_db / real_model / slow / requires_gpu）
# → `external`（串行 `-n 0`）。
# `--allow-system-python` 是脚本为"一次性 CI 镜像"预留的开关，这里正是它的用途。
#
# ## 与票 13 三条要求的对应
#
# - 第一条（普通 CI 至少运行核心 pytest 和文档检查）：本 job 跑 `unit` + `external` 两个通道，
#   覆盖除 `smoke` 外的全部用例，满足"至少核心"的下界（文档检查由 `checks.yml` 承担）。
# - 第三条（物理设备 opt-in、skip 不计作 passed）：
#   物理设备/重档用例（`real_model` / `requires_gpu` / `slow` / `requires_db`）由
#   `QLH_RUN_PHYSICAL_TESTS` 显式开启才收集，本 job **不开启** ⇒ CI 不会以 skip 的形式
#   把"没跑"混进结果；`manifest.json` 的 `physical` 字段记录 `ran=false` 与原因，
#   `smoke` 字段同理。摘要步骤从 JUnit XML 分别读出 passed / skipped / failed，
#   **skipped 单列**，不计入 passed。
name: core-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    # `runner` context 只在 step 内可用（job 级 env 引用它会判定 workflow 无效），
    # 运行时状态隔离变量放在下面各 step 的 env 里。
    steps:
      - uses: actions/checkout@v4
        with:
          # 测试不需要 LFS 大文件；缺工件型用例自行 skip
          lfs: false
          submodules: false

      # Source contracts need packaging; doc-link tests need android documents.
      # Keep this non-recursive: no Android vendor checkout or model/LFS weights.
      - name: Fetch core contract and documentation submodules
        run: git submodule update --init --depth 1 packaging android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      # The native argmax regression compiles the real shim, without weights.
      # Fetch only locked headers; the patched vendor commit need not be hosted.
      - name: Prepare pinned native test headers
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          lock = json.loads((root / "scripts/model_tools/llama_quantize.lock.json").read_text(encoding="utf-8"))
          source = root / lock["source"]
          source.mkdir(parents=True, exist_ok=True)
          patch = next(item for item in lock["patches"] if item["id"] == "layer-forward-api")
          patch_path = root / patch["path"]
          if hashlib.sha256(patch_path.read_bytes()).hexdigest() != patch["sha256"].lower():
              raise SystemExit("Native header patch does not match the lock")

          def git(*args):
              subprocess.run(["git", "-C", str(source), *args], check=True)

          git("init", "-q")
          git("remote", "add", "origin", lock["upstream"]["repository"])
          git("sparse-checkout", "set", "--no-cone", "/include/llama.h", "/ggml/include/*.h")
          git("fetch", "--filter=blob:none", "--depth", "1", "origin", lock["upstream"]["revision"])
          git("checkout", "--detach", "FETCH_HEAD")
          git("apply", "--include=include/llama.h", str(patch_path))
          PY

      - name: Run refactor import and write boundary gate
        run: python -B scripts/check_refactor_boundaries.py

      - name: Run documentation checks
        run: python -B scripts/run_doc_checks.py

      - name: Run test channels（unit -> external）
        env:
          QLH_STATE_DIR: ${{ runner.temp }}/qlh-core-ci/state
          QLH_SQLITE_PATH: ${{ runner.temp }}/qlh-core-ci/local-store.sqlite3
          QLH_NODE_CONFIG_PATH: ${{ runner.temp }}/qlh-core-ci/node_config.json
          QLH_NODE_SECRET_STORE_PATH: ${{ runner.temp }}/qlh-core-ci/node_secrets.json
          QLH_JOURNAL_REPLICATION_REPLICA_PATH: ${{ runner.temp }}/qlh-core-ci/journal-replica.sqlite3
          # 测试专用的集群密钥：缺它时注册/握手用例会把"未初始化"当成注册失败
          # 而误报（本机开发环境已自行设置，CI 必须显式给出）。
          QLH_CLUSTER_SECRET: "qlh-ci-test-cluster-secret-0123456789abcdef"
        run: |
          python -B scripts/run_test_channels.py \
            --channel all \
            --workers 4 \
            --allow-system-python \
            --artifacts-dir build/ci-test-artifacts

      - name: Summarize channels（skip 不计作 passed）
        if: always()
        env:
          QLH_STATE_DIR: ${{ runner.temp }}/qlh-core-ci/state
          QLH_SQLITE_PATH: ${{ runner.temp }}/qlh-core-ci/local-store.sqlite3
          QLH_NODE_CONFIG_PATH: ${{ runner.temp }}/qlh-core-ci/node_config.json
          QLH_NODE_SECRET_STORE_PATH: ${{ runner.temp }}/qlh-core-ci/node_secrets.json
          QLH_JOURNAL_REPLICATION_REPLICA_PATH: ${{ runner.temp }}/qlh-core-ci/journal-replica.sqlite3
        run: python -B scripts/summarize_test_channels.py --artifacts-dir build/ci-test-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-artifacts
          path: build/ci-test-artifacts
          if-no-files-found: warn
