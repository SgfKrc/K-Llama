# 文档检查（CI 兜底）
#
# 为什么有它：文档归档或改名后引用没跟着改，只能靠人发现 —— 实测一次就攒到 20 处死链
# （`docs/` 内 14 处 + README/README.en 等 6 处）。
#
# 覆盖两条**纯静态、只用标准库**的检查（秒级，无需 pip install）：
#   - scripts/check_doc_links.py    相对链接死链
#   - scripts/check_readme_l10n.py  README 双语结构同步
# 两者由 `scripts/run_doc_checks.py` 统一调用 —— **一处定义、两处复用**（本 workflow 与本地
# `.githooks/pre-push`），避免两份清单漂移。
#
# 注意：跨机接力健康检查（scripts/relay_health.py）**不在本 workflow 里** —— 真机检查需要
# 真实服务/设备，属于运行期动作；其单元测试见 tests/test_relay_health.py（ssh 已 mock），
# 而**闸门方向性的 CI 兜底**见 `.github/workflows/relay-gates.yml`：两条脚本各自的
# `--self-check` 用合成输入验证"该红会红"（不需要真机）。

name: doc-checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  doc-checks:
    runs-on: ubuntu-latest
    env:
      # 仓库里有中文文件名/中文文档；显式 UTF-8 避免平台差异带来的解码问题
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # 文档检查不需要 LFS 大文件，跳过 smudge 以加快速度
          lfs: false
          submodules: false

      # `docs/` 里有若干引用指向 `android/` 子模块内的文档（如 Android 验证替代路径）。
      # actions/checkout 默认不检出子模块，缺了它那些链接会全部误报为死链。
      # 只按需拉这一个子模块（浅克隆）——拉全部子模块会明显拖慢这个秒级检查。
      - name: Fetch android submodule (referenced by docs)
        run: git submodule update --init --depth 1 android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 两条检查均只用标准库 ⇒ 无依赖安装步骤
      - name: Run documentation checks
        run: python -B scripts/run_doc_checks.py
