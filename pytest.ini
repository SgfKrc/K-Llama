[pytest]
# 单元测试配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    -n 6
    --maxfail=3
    --timeout=300
# 并发 worker 数说明（T-1 实测，2026-08-14；2026-10-26 复核）：
#   -n auto 在本机会并发约 20 个 pytest worker，其中大量 torch 测试同时
#   import torch/初始化 CUDA ⇒ 内存峰值击穿可用内存、桌面崩溃（实测事件）。
#   2026-08-14 当时本机是 16 GB，故固定 -n 4。
#   2026-10-26 已升级到 31.6 GB（实测 total 31.6 / free ~15.5 GB），20 逻辑核
#   充足 ⇒ 提到 -n 6（留余量，仍不用 auto）。
#   内存更小的机器可再调低，或设 QLH_TEST_WORKERS 覆盖通道脚本。
#   通道脚本默认使用 --dist loadscope；需要暴露测试级竞态时显式传 --dist load。
# 代理支持（直连不通时用 7897 端口）
# env = { "https_proxy": "http://127.0.0.1:7897", "http_proxy": "http://127.0.0.1:7897" }
# 标记注册
markers =
    refactor_contract: R0 product contracts, boundary gates and tracked target defects
    legacy_characterization: old implementation evidence; reviewed and replaced during owner migration
    external: uses PostgreSQL, SMTP, or another external resource; run serially
    real_model: loads actual model weights in the isolated smoke channel
    slow: 慢速测试（需要数据库连接等）
    requires_db: 需要 PostgreSQL 数据库连接
    requires_gpu: 需要 CUDA GPU
    quality_gate: SD 1.5 等自动质量门（regression suite 入口，见 scripts/test_classification_report.py）
