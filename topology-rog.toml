# 三段链式推理，跨机版：master 跑 0-8 + 8-24，ROG 跑 24-40。
#
# 与 topology.toml 的差别只有 tail 段的 host：换成 ROG 的 Tailscale 地址后，
# master 侧不再拉起这一段的 worker（is_local 判断），改为连接过去。
# ROG 那台要先用 rog-worker.cmd 起好 worker。
#
# 为什么跨机：三段合计 21.85 GiB 权重。纯 CPU 段的权重走 mmap，只有被计算图触到的
# 页才常驻，实测两段同载只占 6.67 GB；但 GPU 段基本按文件大小计。
# master 上两段可以跑，三段在 15.2 GB 的 ROG 上刚好卡边。
#
# ★ 不要绑核。本文件早期版本给 stage0 绑 "0,1"、stage1 绑 "2,3,4,5,6,7"，实测
#   stage0 单 step 从 10.2 ms 变成 99.1 ms，整链掉到 1.35 t/s。i9-13900H 相邻逻辑核
#   是同一物理 P-core 的超线程对，而一个 worker 有 5+ 活动线程，挤进 2 个逻辑核
#   等于只用 1 个物理核。留空让调度器分配。

[[stage]]
model      = "F:/qlh-models/stage-split-3/stage-0-8.gguf"
host       = "127.0.0.1"
port       = 9101
layers     = 8
kind       = "gpu"
gpu_layers = 99
cpu_moe    = 0
cpus       = ""
threads    = 3

[[stage]]
model      = "F:/qlh-models/stage-split-3/stage-8-24.gguf"
host       = "127.0.0.1"
port       = 9102
layers     = 16
kind       = "cpu"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 6

[[stage]]
# ROG：Ryzen 5 9600X 6C/12T，15.2 GB 内存，纯 CPU 跑 16 层。
# model 路径是 ROG 上的位置，master 不读它。
model      = "L:/qlh-models/stage-split-3/stage-24-40.gguf"
host       = "100.116.17.12"
port       = 9103
layers     = 16
kind       = "tail"
gpu_layers = 0
cpu_moe    = 0
cpus       = ""
threads    = 6
