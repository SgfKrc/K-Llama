# 跨机两段 35B + MTP：本机 0:32（6 层上卡）+ ROG 32:40（8 层纯 CPU）。
#
# 与 topology-cross.toml 的差别只有模型：这里用带 MTP 头的蒸馏变体，两边必须是**同一个文件**，
# 否则 layer_range 之外的张量（tokenizer / output / nextn）对不上，输出会错得很隐蔽。
#
# gpu_layers 从 12 降到 6：12 层要 9.45 GiB 显存，本机只有 7.91 GiB 可用；6 层约 5.26 GiB。
# 更关键的是 WDDM 溢出——8 层时实测 4.41 GiB resident for 5.21 GiB weights，溢出后比纯 CPU 还慢。
#
# ROG 侧不 spill（15.2 GiB 总内存、8 层约 4.4 GiB），所以跨机才是能测出投机真实收益的配置。

source_layers = 40

[[stage]]
model       = "H:/qlh_models/qwen3-6-35b-a3b-opus47-distill-apex-mtp/Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-APEX-MTP-I-Quality.gguf"
host        = "127.0.0.1"
port        = 9101
layers      = 32
layer_range = "0:32"
kind        = "gpu"
gpu_layers  = 6
cpu_moe     = 0
cpus        = ""
threads     = 8

[[stage]]
model       = "L:/qlh-models/qwen3-6-35b-a3b-mtp/Qwen3.6-35B-A3B-Claude-4.7-Opus-Reasoning-Distilled-APEX-MTP-I-Quality.gguf"
host        = "100.116.17.12"
port        = 9103
layers      = 8
layer_range = "32:40"
kind        = "tail"
gpu_layers  = 0
cpu_moe     = 0
cpus        = ""
threads     = 6
